# Dependabot version and security updates.
# Docs: https://docs.github.com/code-security/dependabot/working-with-dependabot/dependabot-options-reference
version: 2
updates:
  # Hexo, its plugins, and the Netlify function share the root package.json.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    groups:
      # One PR per run for minor and patch bumps. Major versions are left
      # ungrouped so each breaking upgrade gets its own PR.
      npm-minor-and-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
      # Bundle security fixes for several packages into one PR.
      npm-security:
        applies-to: security-updates
        patterns:
          - "*"
