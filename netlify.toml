[build]
  command = "npm run build"
  publish = "public"

[build.environment]
  # Hexo 8 needs Node.js 20.19 or newer
  NODE_VERSION = "22"

[functions."daily-rebuild"]
  schedule = "0 0 * * *"

# note: each of these fields are OPTIONAL, with an exception that when you're specifying "command" and "port", you must specify framework = "#custom"
[dev]
  framework = "hexo"
  #command = "npm run instagram"
  command = "npm run serve" # Command to start your dev server
  autoLaunch = true # a Boolean value that determines if Netlify Dev launches the local server address in your browser
